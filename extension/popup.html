<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popup.css"><title>Brit Placement</title></head>
<body><header><div class="brand"><span>B</span><div><b>BRIT INSTITUTE</b><small>AUTO-APPLY</small></div></div><div class="status" id="runner-state">OFF</div></header>
<main>
<details id="setup"><summary>Connection</summary>
<label>Backend URL<input id="backend" placeholder="http://127.0.0.1:8770"></label>
<label>Admin key<input type="password" id="token" placeholder="Contents of data\admin-token.txt"></label>
<button class="minor" id="connect">Connect / refresh candidates</button>
</details>
<label>Candidate using this Chrome profile<select id="learner"><option value="">Connect to load candidates</option></select></label>
<p class="hint">Sign in to LinkedIn, Indeed and other boards in this Chrome profile as this candidate.</p>
<div class="zone">
<label class="toggle"><input type="checkbox" id="runner"> Auto-apply to queued jobs</label>
<label class="toggle"><input type="checkbox" id="searcher"> Search job boards every 2 hours</label>
<label class="toggle"><input type="checkbox" id="company-sites"> Also apply on company career sites</label>
<div class="row"><button class="secondary" id="run-queue">Apply to next job now</button><button class="secondary" id="run-search">Search boards now</button></div>
</div>
<div class="zone"><h3>This page</h3><p id="page">Open a job advert or application form.</p>
<button class="primary" id="apply-here">Auto-apply to this job</button>
<div class="row"><button class="secondary" id="fill-here">Fill only (I submit)</button><button class="secondary" id="harvest-here">Save jobs listed here</button></div>
</div>
<div id="last" class="last"></div>
<div id="message" role="status"></div>
</main><script src="popup.js"></script></body></html>
